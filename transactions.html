<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledgerly | Transactions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="transactions">
    <div class="app-shell">
      <!-- Primary navigation sidebar -->
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="index.html"
          ><span class="brand-mark"><i class="bi bi-wallet2"></i></span
          ><span>Ledgerly</span></a
        >
        <nav class="side-nav">
          <a href="index.html"><i class="bi bi-grid-1x2"></i>Overview</a
          ><a class="active" href="transactions.html"
            ><i class="bi bi-arrow-left-right"></i>Transactions</a
          >
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-tip">
            <i class="bi bi-shield-check"></i
            ><span>Your finances live securely in this browser.</span>
          </div>
          <button class="theme-toggle" data-theme-toggle>
            <i class="bi bi-moon-stars"></i><span>Dark appearance</span>
          </button>
        </div>
      </aside>
      <!-- Transaction management content -->
      <main class="main-content">
        <!-- Page heading and global actions -->
        <header class="topbar">
          <button
            class="icon-btn d-lg-none"
            id="menuButton"
            aria-label="Open menu"
          >
            <i class="bi bi-list"></i>
          </button>
          <div>
            <p class="eyebrow mb-1">FINANCIAL ACTIVITY</p>
            <h1>Transactions</h1>
          </div>
          <div class="top-actions">
            <button
              class="icon-btn"
              data-theme-toggle
              aria-label="Toggle theme"
            >
              <i class="bi bi-moon-stars"></i></button
            ><button
              class="btn btn-primary add-trigger"
              data-bs-toggle="modal"
              data-bs-target="#transactionModal"
            >
              <i class="bi bi-plus-lg"></i><span>Add transaction</span>
            </button>
          </div>
        </header>
        <!-- Search, filter, sort, and transaction table -->
        <section class="surface transaction-surface">
          <div class="toolbar">
            <div class="search-box">
              <i class="bi bi-search"></i
              ><input id="searchInput" placeholder="Search transactions" />
            </div>
            <select id="categoryFilter" class="form-select">
              <option value="all">All categories</option></select
            ><select id="typeFilter" class="form-select">
              <option value="all">All types</option>
              <option value="income">Income</option>
              <option value="expense">Expenses</option></select
            ><select id="sortSelect" class="form-select">
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
              <option value="amount-desc">Highest amount</option>
              <option value="amount-asc">Lowest amount</option></select
            ><button
              id="clearData"
              class="btn btn-outline-danger"
              title="Clear all data"
            >
              <i class="bi bi-trash3"></i><span>Clear data</span>
            </button>
          </div>
          <div id="transactionsTable"></div>
        </section>
      </main>
    </div>
    <!-- Add or edit transaction dialog -->
    <div class="modal fade" id="transactionModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="transactionForm" novalidate>
            <div class="modal-header">
              <div>
                <p class="eyebrow mb-1">ENTRY DETAILS</p>
                <h2 class="modal-title fs-5" id="transactionModalTitle">
                  Add transaction
                </h2>
              </div>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="transactionId" />
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label" for="title">Title</label
                  ><input
                    class="form-control"
                    id="title"
                    required
                    placeholder="e.g. Monthly salary"
                  />
                  <div class="invalid-feedback">A title is required.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="amount">Amount</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span
                    ><input
                      class="form-control"
                      id="amount"
                      type="number"
                      min="0.01"
                      step="0.01"
                      required
                      placeholder="0.00"
                    />
                    <div class="invalid-feedback">
                      Enter an amount greater than zero.
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="type">Type</label
                  ><select class="form-select" id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="category">Category</label
                  ><select class="form-select" id="category" required></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="date">Date</label
                  ><input class="form-control" id="date" type="date" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="description"
                    >Notes <span class="muted">optional</span></label
                  ><textarea
                    class="form-control"
                    id="description"
                    rows="2"
                    placeholder="Add a note"
                  ></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel</button
              ><button type="submit" class="btn btn-primary">
                Save transaction
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Transient application feedback -->
    <div id="toast" class="app-toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script src="js/transactions.js"></script>
  </body>
</html>
